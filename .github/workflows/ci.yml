name: validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: |
          python -m pip install "coverage>=7.6,<8"
          python -m coverage run --branch --source=src/av_validator -m unittest discover -s tests -v
          python -m coverage report --show-missing --fail-under=85
